name: Tests

on:
  push:
    branches: [main, devel]
    paths:
      - 'distrib/**'
      - '.github/workflows/tests.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'distrib/**'
      - '.github/workflows/tests.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that all ports declare the same version
        run: python3 .github/scripts/check_versions.py

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy
      - name: Run tests
        working-directory: distrib/python/test
        run: python test_all.py

  julia:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run tests
        run: julia --color=yes --project=distrib/julia -e "using Pkg; Pkg.test()"

  octave:
    name: Octave (MATLAB compat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave
      - name: Run tests
        working-directory: distrib/matlab/test
        run: |
          octave --no-gui --quiet --eval "addpath('..'); exit_code = test_all(); exit(exit_code)"
