name: Tests

on:
  push:
    branches: [main, devel]
    paths:
      - 'distrib/**'
      - '.github/workflows/tests.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'distrib/**'
      - '.github/workflows/tests.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy
      - name: Run tests
        working-directory: distrib/python/test
        run: python test_all.py

  julia:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: distrib/julia
      - uses: julia-actions/julia-runtest@v1
        with:
          project: distrib/julia
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: distrib/julia/src
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: julia
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  octave:
    name: Octave (MATLAB compat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave
      - name: Run tests
        working-directory: distrib/matlab/test
        run: |
          octave --no-gui --quiet --eval "addpath('..'); exit_code = test_all(); exit(exit_code)"

  # Experimental ports: system LAPACK backed by OpenBLAS. Each job saves its
  # CROSSPORT lines for the crossport job below.
  cpp:
    name: C++ port
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install LAPACK
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev libopenblas-dev
      - name: Build
        run: |
          cmake -S distrib/cpp -B build -DLIBRLA_LAPACK=System -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Run tests
        run: ./build/test_all | tee test.log
      - name: Run demo
        run: ./build/demo_basic
      - name: Save CROSSPORT lines
        run: grep '^CROSSPORT' test.log > cpp.txt
      - uses: actions/upload-artifact@v4
        with:
          name: crossport-cpp
          path: cpp.txt

  rust:
    name: Rust port
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: distrib/rust
    env:
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install LAPACK
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev libopenblas-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --release
      - name: Run demo
        run: cargo run --release --example demo
      - name: Save CROSSPORT lines
        run: cargo run --release --example crossport | tee "$GITHUB_WORKSPACE/rust.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: crossport-rust
          path: rust.txt

  fortran03:
    name: Fortran 2003 port
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: distrib/fortran03
    env:
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran and LAPACK
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libopenblas-dev
      - name: Run tests
        run: make test | tee test.log
      - name: Run demo
        run: make demo
      - name: Save CROSSPORT lines
        run: grep '^CROSSPORT' test.log > "$GITHUB_WORKSPACE/fortran03.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: crossport-fortran03
          path: fortran03.txt

  fortran95:
    name: Fortran 95 port
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: distrib/fortran95
    env:
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran and LAPACK
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libopenblas-dev
      - name: Check that the generated sources match their templates
        run: python3 tools/generate.py --check
      - name: Run tests
        run: make test | tee test.log
      - name: Run demo
        run: make demo
      - name: Save CROSSPORT lines
        run: grep '^CROSSPORT' test.log > "$GITHUB_WORKSPACE/fortran95.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: crossport-fortran95
          path: fortran95.txt

  fortran77:
    name: Fortran 77 port
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: distrib/fortran77
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
      - name: Check that the generated sources match their templates
        run: python3 tools/generate.py --check
      - name: Run tests
        run: make test | tee test.log
      - name: Run demo
        run: make demo
      - name: Run the quad-precision check
        run: make test-quad
      - name: Save CROSSPORT lines
        run: grep '^CROSSPORT' test.log > "$GITHUB_WORKSPACE/fortran77.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: crossport-fortran77
          path: fortran77.txt

  crossport:
    name: Cross-port consistency
    needs: [cpp, rust, fortran03, fortran95, fortran77]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: crossport-*
          merge-multiple: true
          path: crossport
      - name: Compare CROSSPORT lines
        run: >-
          python3 .github/scripts/check_crossport.py crossport/cpp.txt
          crossport/rust.txt crossport/fortran03.txt crossport/fortran95.txt
          crossport/fortran77.txt
