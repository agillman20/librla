name: Tests

on:
  push:
    branches: [main, devel]
    paths:
      - 'distrib/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'distrib/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy
      - name: Run tests
        working-directory: distrib/python/test
        run: python test_all.py

  julia:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: distrib/julia
      - uses: julia-actions/julia-runtest@v1
        with:
          project: distrib/julia
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: distrib/julia/src
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: julia
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  octave:
    name: Octave (MATLAB compat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave
      - name: Run tests
        working-directory: distrib/matlab/test
        run: |
          octave --no-gui --quiet --eval "addpath('..'); exit_code = test_all(); exit(exit_code)"
