name: Publish to PyPI

# Publishes the Python package from distrib/python via PyPI Trusted
# Publishing (OIDC) - no tokens or passwords are stored anywhere.
# Requires a one-time configuration on PyPI (project librla ->
# Publishing -> add GitHub publisher: owner agillman20, repo librla,
# workflow publish.yml, environment pypi).
#
# Triggers on pushing a version tag (v*), or manually from the
# Actions tab (workflow_dispatch) - the manual run builds whatever
# version pyproject.toml declares on the selected ref.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        working-directory: distrib/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: distrib/python/dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
