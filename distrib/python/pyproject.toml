[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "librla"
version = "1.1.0"
description = "Randomized linear-algebra routines for low-rank matrix factorizations"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Adrianna Gillman" },
    { name = "Zydrunas Gimbutas" },
]
keywords = [
    "randomized linear algebra",
    "low-rank factorization",
    "interpolative decomposition",
    "randomized svd",
    "sketching",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/agillman20/librla"
Repository = "https://github.com/agillman20/librla"
Issues = "https://github.com/agillman20/librla/issues"

[tool.setuptools]
py-modules = ["librla"]
